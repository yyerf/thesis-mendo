<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mendo POS — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pos.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <h1>💊 Mendo</h1>
      <p>Point of Sale System</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash--{{ category }}" style="margin-bottom: 20px;">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin.login') }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" id="username" name="username"
               placeholder="Enter your username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password"
               placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn--primary btn--lg btn--block" style="margin-top: 8px;">
        Sign In
      </button>
    </form>

    <p style="text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-muted);">
      OTC Medicine Vending &middot; Mendo &copy; 2026
    </p>
  </div>
</div>
</body>
</html>
