<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1070" viewBox="0 0 880 1070">
<defs>
<style>
  .bg{fill:#ffffff}
  .box{fill:#ffffff;stroke:#5f7488;stroke-width:2.2}
  .ghost{fill:#fbfcfd;stroke:#9aa7b5;stroke-width:2;stroke-dasharray:9 6}
  .ttl{font:700 25px Helvetica,Arial,sans-serif;fill:#132435}
  .bd{font:400 20px Helvetica,Arial,sans-serif;fill:#37485a}
  .sm{font:400 17px Helvetica,Arial,sans-serif;fill:#6b7a89}
  .lg{font:400 15px Helvetica,Arial,sans-serif;fill:#6b7a89}
  .wl{font:700 16px Helvetica,Arial,sans-serif;fill:#2f5f8f}
  .wls{font:400 14px Helvetica,Arial,sans-serif;fill:#6b7a89}
  .gh{font:400 17px Helvetica,Arial,sans-serif;fill:#8a7550}
  .out{font:700 22px Helvetica,Arial,sans-serif;fill:#132435}
  .c{text-anchor:middle}
  .e{text-anchor:end}
  .sig{fill:none;stroke:#2f5f8f;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
  .pwr{fill:none;stroke:#b03a2e;stroke-width:2.4;stroke-linecap:round}
</style>
<marker id="as" markerWidth="10" markerHeight="10" refX="8.4" refY="5" orient="auto">
  <path d="M0,0 L10,5 L0,10 z" fill="#2f5f8f"/></marker>
<marker id="ap" markerWidth="10" markerHeight="10" refX="8.4" refY="5" orient="auto">
  <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker>
</defs>

<rect class="bg" width="880" height="1070"/>

<!-- region: designed, not yet actuated (behind the boxes) -->
<rect class="ghost" x="335" y="508" width="520" height="336" rx="12"/>
<text x="841" y="832" class="gh e">designed — not yet actuated</text>

<!-- 1. front panel -->
<rect class="box" x="375" y="40" width="440" height="86" rx="10"/>
<text x="595" y="76" class="ttl c">Kiosk front panel</text>
<text x="595" y="105" class="sm c">touchscreen · microphone · bill and coin slots</text>

<path class="sig" marker-end="url(#as)" d="M595,126 L595,178"/>
<text x="613" y="158" class="wl">HDMI + USB</text>

<!-- 2. compute -->
<rect class="box" x="405" y="182" width="380" height="114" rx="10"/>
<text x="595" y="220" class="ttl c">Raspberry Pi 5</text>
<text x="595" y="252" class="bd c">runs the whole kiosk offline</text>
<text x="595" y="281" class="sm c">consultation · orders · records</text>

<path class="sig" marker-end="url(#as)" d="M595,296 L595,348"/>
<text x="613" y="328" class="wl">USB serial · 115200 baud</text>

<!-- 3. controller -->
<rect class="box" x="425" y="352" width="340" height="114" rx="10"/>
<text x="595" y="390" class="ttl c">Arduino Uno R3</text>
<text x="595" y="422" class="bd c">real-time controller</text>
<text x="595" y="451" class="sm c">counts pulses · drives servos</text>

<!-- 4. cash acceptors -->
<rect class="box" x="25" y="332" width="275" height="134" rx="10"/>
<text x="162" y="370" class="ttl c">Cash acceptors</text>
<text x="162" y="404" class="bd c">notes ₱20 / ₱50 / ₱100</text>
<text x="162" y="436" class="bd c">coins ₱1 / ₱5 / ₱10</text>

<!-- money in -->
<path class="sig" marker-end="url(#as)" d="M375,84 L162,84 L162,326"/>
<text x="178" y="212" class="wl">₱ notes and coins</text>

<!-- credit pulses in -->
<path class="sig" marker-end="url(#as)" d="M300,428 L419,428"/>
<text x="360" y="390" class="wl c">credit pulses</text>
<text x="360" y="409" class="wls c">opto-isolated</text>

<!-- 12 V supply -->
<rect class="box" x="40" y="500" width="245" height="64" rx="10"/>
<text x="162" y="529" class="bd c">12 V supply</text>
<text x="162" y="552" class="sm c">separately fused</text>
<path class="pwr" marker-end="url(#ap)" d="M162,500 L162,472"/>

<!-- 5. PWM driver -->
<path class="sig" marker-end="url(#as)" d="M595,466 L595,524"/>
<text x="613" y="502" class="wl">I²C</text>

<rect class="box" x="420" y="528" width="350" height="90" rx="10"/>
<text x="595" y="566" class="ttl c">PCA9685 driver</text>
<text x="595" y="598" class="bd c">10 channels → 10 slots</text>

<path class="sig" marker-end="url(#as)" d="M595,618 L595,670"/>
<text x="613" y="650" class="wl">PWM · one servo at a time</text>

<!-- 6. dispensing slots -->
<rect class="box" x="350" y="674" width="490" height="132" rx="10"/>
<text x="595" y="714" class="ttl c">10 dispensing slots</text>
<text x="595" y="746" class="bd c">one medicine per slot</text>
<text x="595" y="778" class="sm c">a servo turns the rotor 40° — one container drops</text>

<!-- 5 V servo supply -->
<rect class="box" x="40" y="664" width="245" height="64" rx="10"/>
<text x="162" y="693" class="bd c">5 V servo supply</text>
<text x="162" y="716" class="sm c">separately fused</text>
<path class="pwr" marker-end="url(#ap)" d="M285,696 L344,696"/>

<!-- 7. collection bin -->
<path class="sig" marker-end="url(#as)" d="M595,806 L595,858"/>

<rect class="box" x="420" y="862" width="350" height="78" rx="10"/>
<text x="595" y="898" class="ttl c">Collection bin</text>
<text x="595" y="925" class="sm c">shared, locked</text>

<path class="sig" marker-end="url(#as)" d="M595,940 L595,968"/>
<text x="595" y="994" class="out c">medicine to the patient</text>

<!-- legend -->
<line x1="40" y1="1014" x2="840" y2="1014" stroke="#cbd6e0" stroke-width="1.4"/>
<rect class="box" x="40" y="1030" width="34" height="18" rx="4"/>
<text x="84" y="1044" class="lg">present and measured</text>
<rect class="ghost" x="275" y="1030" width="34" height="18" rx="4"/>
<text x="319" y="1044" class="lg">designed, not yet actuated</text>
<path class="pwr" d="M555,1039 L589,1039"/>
<text x="599" y="1044" class="lg">separate fused power domain</text>
</svg>
