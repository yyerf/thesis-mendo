<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">TB WEL-R7U02 bill-only observer wiring to Arduino Uno</title>
  <desc id="desc">Observe-only wiring for the TB METER pulse output: separate 12 volt TB power, external 4.7 kiloohm pull-up, METER signal to Arduino D3, and METER return to Arduino logic ground. The inhibit pair is intentionally not connected in this diagnostic setup.</desc>
  <defs>
    <style>
      .bg{fill:#f5f8f6}.title{font:800 36px Arial,sans-serif;fill:#12362a}.subtitle{font:500 19px Arial,sans-serif;fill:#587066}.zone{fill:#fff;stroke:#b8cec1;stroke-width:2}.head{font:800 22px Arial,sans-serif;fill:#fff;letter-spacing:1px}.tbhead{fill:#215e49}.ifacehead{fill:#a36d21}.unohead{fill:#3e6e91}.body{font:600 18px Arial,sans-serif;fill:#17352c}.label{font:700 20px Arial,sans-serif;fill:#17352c}.small{font:500 16px Arial,sans-serif;fill:#3e5b50}.tiny{font:500 14px Arial,sans-serif;fill:#587066}.value{font:700 17px Arial,sans-serif;fill:#17352c}.mono{font:700 16px 'Courier New',monospace;fill:#26473a}.center{text-anchor:middle}.right{text-anchor:end}.warn{fill:#fff2d9;stroke:#d4a34c;stroke-width:2}.warntext{font:700 18px Arial,sans-serif;fill:#6d4a11}.note{fill:#edf5ef;stroke:#aac5b4;stroke-width:2}.chip{fill:#eef5fb;stroke:#7196b4;stroke-width:2}.res{fill:#fff9ed;stroke:#b47d26;stroke-width:2}.tablehead{fill:#dcebe1}.line{stroke:#b7cbbd;stroke-width:1}.isolation{fill:none;stroke:#84978e;stroke-width:2;stroke-dasharray:8 8}.dash{fill:none;stroke:#b47d26;stroke-width:3;stroke-dasharray:8 7}.wire-red{fill:none;stroke:#d6534d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.wire-orange{fill:none;stroke:#d98236;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.wire-blue{fill:none;stroke:#367cb4;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.wire-purple{fill:none;stroke:#8b5ca8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.wire-black{fill:none;stroke:#253b35;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.node{fill:#fff;stroke:#17352c;stroke-width:2}.red{fill:#c4473d}.orange{fill:#c76e26}.blue{fill:#2d70a6}.purple{fill:#74428f}.yellow{fill:#aa8412}.green{fill:#27724d}.danger{fill:#9c3d30}.center{text-anchor:middle}
    </style>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d6534d"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98236"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#367cb4"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b5ca8"/></marker>
  </defs>

  <rect class="bg" width="1600" height="1100"/>
  <text x="70" y="58" class="title">TB WEL-R7U02 bill-only observer → Arduino Uno</text>
  <text x="70" y="91" class="subtitle">Pulse capture and PHP hypothesis display - no order credit, no inhibit drive, no servo control</text>

  <rect x="70" y="115" width="1460" height="72" rx="14" class="warn"/>
  <text x="98" y="146" class="warntext">SAFETY GATE - Use a separate fused 12 V supply. Never connect TB 12 V to an Arduino pin.</text>
  <text x="98" y="173" class="small">This observer leaves D4 undriven. Keep the inhibit pair disconnected and do not insert notes until its polarity is separately proven.</text>

  <rect x="70" y="215" width="380" height="625" rx="18" class="zone"/>
  <rect x="480" y="215" width="640" height="625" rx="18" class="zone"/>
  <rect x="1150" y="215" width="380" height="625" rx="18" class="zone"/>
  <rect x="70" y="215" width="380" height="58" rx="18" class="tbhead"/>
  <rect x="480" y="215" width="640" height="58" rx="18" class="ifacehead"/>
  <rect x="1150" y="215" width="380" height="58" rx="18" class="unohead"/>
  <text x="260" y="251" class="head center">TB / HARNESS</text>
  <text x="800" y="251" class="head center">BILL OBSERVER</text>
  <text x="1340" y="251" class="head center">ARDUINO UNO</text>

  <!-- TB harness table -->
  <rect x="105" y="305" width="310" height="90" rx="12" class="note"/>
  <text x="260" y="337" class="label center">WEL-R7U02</text>
  <text x="260" y="366" class="body center">TB bill acceptor</text>
  <text x="260" y="388" class="tiny center">continuity-test colors first</text>
  <text x="105" y="425" class="label">Connections used</text>
  <rect x="95" y="440" width="330" height="34" class="tablehead"/>
  <text x="112" y="463" class="value">Pin</text><text x="175" y="463" class="value">Color</text><text x="275" y="463" class="value">Function</text>
  <path d="M95 474 H425 M95 508 H425 M95 542 H425 M95 576 H425 M95 610 H425 M95 644 H425 M95 678 H425" class="line"/>
  <text x="112" y="498" class="mono">5</text><circle cx="159" cy="492" r="7" class="red"/><text x="175" y="498" class="value">RED</text><text x="275" y="498" class="value">+12 V DC</text>
  <text x="112" y="532" class="mono">9</text><circle cx="159" cy="526" r="7" class="orange"/><text x="175" y="532" class="value">ORANGE</text><text x="275" y="532" class="value">12 V return</text>
  <text x="112" y="566" class="mono">7</text><circle cx="159" cy="560" r="7" class="blue"/><text x="175" y="566" class="value">BLUE</text><text x="275" y="566" class="value">METER+</text>
  <text x="112" y="600" class="mono">8</text><circle cx="159" cy="594" r="7" class="purple"/><text x="175" y="600" class="value">PURPLE</text><text x="275" y="600" class="value">METER-</text>
  <text x="112" y="634" class="mono">1,2</text><text x="175" y="634" class="value">Y/G</text><text x="275" y="634" class="value">INHIBIT - leave open</text>
  <text x="112" y="668" class="mono">3,4,6</text><text x="175" y="668" class="value">-</text><text x="275" y="668" class="value">not used here</text>
  <rect x="105" y="710" width="310" height="95" rx="12" class="warn"/>
  <text x="260" y="738" class="body center">Do not connect Y/G to Uno</text>
  <text x="260" y="763" class="small center">The observer does not enable</text>
  <text x="260" y="786" class="small center">or reject bills.</text>

  <!-- 12 V power -->
  <text x="515" y="310" class="label">Separate TB power - not Arduino power</text>
  <rect x="515" y="330" width="175" height="65" rx="10" class="res"/>
  <text x="602" y="357" class="label center">12 V DC PSU</text>
  <text x="602" y="380" class="small center">regulated + fused</text>
  <rect x="720" y="341" width="92" height="44" rx="7" class="res"/>
  <text x="766" y="368" class="value center">F1 3 A*</text>
  <path d="M690 363 H720" class="wire-red" marker-end="url(#arrowRed)"/>
  <path d="M812 363 H970" class="wire-red" marker-end="url(#arrowRed)"/>
  <text x="835" y="350" class="small">TB pin 5 RED +12 V</text>
  <path d="M602 395 V414 H970" class="wire-orange" marker-end="url(#arrowOrange)"/>
  <text x="835" y="409" class="small">TB pin 9 ORANGE 12 V return</text>
  <text x="515" y="442" class="tiny">12 V never enters D3, D4, D5, or any Uno pin.</text>

  <!-- METER signal -->
  <path d="M515 565 H1190" class="wire-blue" marker-end="url(#arrowBlue)"/>
  <text x="515" y="557" class="small blue">BLUE METER+</text>
  <rect x="660" y="510" width="58" height="55" rx="8" class="res"/>
  <path d="M689 510 V482" class="wire-black"/>
  <circle cx="689" cy="482" r="7" class="node"/>
  <text x="735" y="488" class="small">Arduino 5 V</text>
  <text x="735" y="538" class="value">R1 4.7 kOhm pull-up</text>
  <path d="M515 625 H1190" class="wire-purple" marker-end="url(#arrowPurple)"/>
  <text x="515" y="617" class="small purple">TB pin 8 PURPLE METER-</text>
  <text x="515" y="673" class="label">Observer output</text>
  <text x="515" y="700" class="small">Serial 115200 baud; send ARM, then insert/test a pulse train.</text>
  <text x="515" y="727" class="small">Prints raw pulses, edge timestamps, widths, gaps, and candidate PHP.</text>
  <text x="515" y="754" class="small">Candidate mapping is unverified: 2→₱20, 5→₱50, 10→₱100.</text>
  <text x="515" y="781" class="small">Unknown counts print UNKNOWN and never credit an order.</text>
  <path d="M1015 290 V810" class="isolation"/>
  <text x="1015" y="828" class="tiny center">signal boundary</text>

  <!-- Uno -->
  <rect x="1190" y="320" width="290" height="450" rx="16" class="chip"/>
  <text x="1335" y="360" class="label center">Arduino Uno R3</text>
  <text x="1335" y="387" class="small center">USB powers logic only</text>
  <line x1="1215" y1="420" x2="1455" y2="420" stroke="#a7bfd4" stroke-width="2"/>
  <text x="1225" y="449" class="body">5 V</text><text x="1450" y="449" class="small right">pull-up source</text>
  <circle cx="1190" cy="565" r="7" class="node"/><text x="1220" y="572" class="body">D3 / INT1</text><text x="1450" y="572" class="small right">METER pulse</text>
  <circle cx="1190" cy="625" r="7" class="node"/><text x="1220" y="632" class="body">GND</text><text x="1450" y="632" class="small right">METER return</text>
  <text x="1335" y="680" class="body center">D4 = not driven</text>
  <text x="1335" y="708" class="small center">D5 = coin power off</text>
  <text x="1335" y="736" class="small center">D7 = PCA disabled</text>

  <!-- bottom checklist -->
  <rect x="70" y="875" width="1460" height="170" rx="14" class="warn"/>
  <text x="100" y="910" class="warntext">BEFORE A PULSE TRIAL</text>
  <text x="100" y="938" class="small">1. Verify the exact WEL-R7U02 harness by continuity; red/orange power stays on the separate 12 V supply.</text>
  <text x="100" y="965" class="small">2. Install the external 4.7 kOhm pull-up; measure the D3 node as 0–5 V before connecting the Uno.</text>
  <text x="100" y="992" class="small">3. Leave yellow/green inhibit disconnected for this observer. Do not insert notes unless the TB inhibit state is independently proven.</text>
  <text x="100" y="1019" class="small">4. Open Serial Monitor at 115200, send ARM, and treat all PHP values as unverified calibration output.</text>
</svg>
