<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title desc">
  <title id="title">TOPVME TB WEL-R7U02 to Arduino Uno wiring diagram</title>
  <desc id="desc">Bench wiring reference for the TB bill acceptor pulse meter and inhibit interface. The TB power side, isolated signal interface, and Arduino Uno logic side are shown separately with all required safety checks.</desc>
  <defs>
    <style>
      .bg{fill:#f5f8f6}.title{font:800 36px Arial,sans-serif;fill:#12362a}.subtitle{font:500 19px Arial,sans-serif;fill:#587066}.zone{fill:#fff;stroke:#b8cec1;stroke-width:2}.zonehead{font:800 22px Arial,sans-serif;fill:#fff;letter-spacing:1px}.tbhead{fill:#215e49}.ifacehead{fill:#a36d21}.unohead{fill:#3e6e91}.body{font:600 18px Arial,sans-serif;fill:#17352c}.label{font:700 20px Arial,sans-serif;fill:#17352c}.small{font:500 16px Arial,sans-serif;fill:#3e5b50}.tiny{font:500 14px Arial,sans-serif;fill:#587066}.value{font:700 17px Arial,sans-serif;fill:#17352c}.mono{font:700 16px 'Courier New',monospace;fill:#26473a}.center{text-anchor:middle}.right{text-anchor:end}.warn{fill:#fff2d9;stroke:#d4a34c;stroke-width:2}.warntext{font:700 18px Arial,sans-serif;fill:#6d4a11}.note{fill:#edf5ef;stroke:#aac5b4;stroke-width:2}.chip{fill:#eef5fb;stroke:#7196b4;stroke-width:2}.res{fill:#fff9ed;stroke:#b47d26;stroke-width:2}.tablehead{fill:#dcebe1}.line{stroke:#b7cbbd;stroke-width:1}.isolation{fill:none;stroke:#84978e;stroke-width:2;stroke-dasharray:8 8}.wire-red{fill:none;stroke:#d6534d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.wire-orange{fill:none;stroke:#d98236;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.wire-blue{fill:none;stroke:#367cb4;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.wire-purple{fill:none;stroke:#8b5ca8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.wire-yellow{fill:none;stroke:#d6ad26;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.wire-green{fill:none;stroke:#3b8b65;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.wire-black{fill:none;stroke:#253b35;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.node{fill:#fff;stroke:#17352c;stroke-width:2}.red{fill:#c4473d}.orange{fill:#c76e26}.blue{fill:#2d70a6}.purple{fill:#74428f}.yellow{fill:#aa8412}.green{fill:#27724d}.danger{fill:#9c3d30}.ok{fill:#216348}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#253b35"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#367cb4"/></marker>
    <marker id="arrowYellow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d6ad26"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b8b65"/></marker>
  </defs>

  <rect class="bg" width="1600" height="1250"/>
  <text x="70" y="62" class="title">TB WEL-R7U02 to Arduino Uno</text>
  <text x="70" y="96" class="subtitle">Pulse interface and fail-safe inhibit control - bench wiring reference</text>

  <rect x="70" y="120" width="1460" height="78" rx="14" class="warn"/>
  <text x="98" y="151" class="warntext">SAFETY GATE - Verify exact TB model, harness continuity, PHP DIP sheet, and inhibit polarity before power.</text>
  <text x="98" y="179" class="small">Never connect the TB 12 V supply to an Arduino pin. Keep the bill acceptor inhibited until every conditioned signal measures 0-5 V.</text>

  <!-- Three wiring zones -->
  <rect x="70" y="230" width="380" height="760" rx="18" class="zone"/>
  <rect x="480" y="230" width="640" height="760" rx="18" class="zone"/>
  <rect x="1150" y="230" width="380" height="760" rx="18" class="zone"/>
  <rect x="70" y="230" width="380" height="58" rx="18" class="tbhead"/>
  <rect x="480" y="230" width="640" height="58" rx="18" class="ifacehead"/>
  <rect x="1150" y="230" width="380" height="58" rx="18" class="unohead"/>
  <text x="260" y="266" class="zonehead center">TB / HARNESS</text>
  <text x="800" y="266" class="zonehead center">INTERFACE CIRCUITS</text>
  <text x="1340" y="266" class="zonehead center">ARDUINO UNO</text>

  <!-- TB zone -->
  <rect x="105" y="325" width="310" height="140" rx="14" fill="#e8f1eb" stroke="#6e9c7e" stroke-width="3"/>
  <text x="260" y="363" class="label center">TB74-U / TB77-U</text>
  <text x="260" y="391" class="body center">WEL-R7U02 harness</text>
  <text x="260" y="426" class="small center">METER pulse + inhibit input</text>
  <text x="260" y="452" class="tiny center">Internal signal isolation shown in manual</text>

  <text x="105" y="497" class="label">Harness pins - verify with continuity</text>
  <rect x="95" y="515" width="330" height="35" class="tablehead"/>
  <text x="112" y="538" class="value">AMP pin</text><text x="190" y="538" class="value">Color</text><text x="275" y="538" class="value">TB function</text>
  <path d="M95 550 H425 M95 585 H425 M95 620 H425 M95 655 H425 M95 690 H425 M95 725 H425 M95 760 H425 M95 795 H425" class="line"/>
  <text x="112" y="574" class="mono">1</text><circle cx="183" cy="568" r="7" class="yellow"/><text x="198" y="574" class="value">YELLOW</text><text x="275" y="574" class="value">INHIBIT+</text>
  <text x="112" y="609" class="mono">2</text><circle cx="183" cy="603" r="7" class="green"/><text x="198" y="609" class="value">GREEN</text><text x="275" y="609" class="value">INHIBIT-</text>
  <text x="112" y="644" class="mono">5</text><circle cx="183" cy="638" r="7" class="red"/><text x="198" y="644" class="value">RED</text><text x="275" y="644" class="value">+12 V DC</text>
  <text x="112" y="679" class="mono">7</text><circle cx="183" cy="673" r="7" class="blue"/><text x="198" y="679" class="value">BLUE</text><text x="275" y="679" class="value">METER+</text>
  <text x="112" y="714" class="mono">8</text><circle cx="183" cy="708" r="7" class="purple"/><text x="198" y="714" class="value">PURPLE</text><text x="275" y="714" class="value">METER-</text>
  <text x="112" y="749" class="mono">9</text><circle cx="183" cy="743" r="7" class="orange"/><text x="198" y="749" class="value">ORANGE</text><text x="275" y="749" class="value">12 V GND</text>
  <text x="112" y="784" class="mono">3,4,6</text><text x="198" y="784" class="value">-</text><text x="275" y="784" class="value">not used here</text>
  <rect x="105" y="830" width="310" height="92" rx="12" class="note"/>
  <text x="260" y="857" class="body center">Harness reference only</text>
  <text x="260" y="882" class="small center">Do not trust color without continuity.</text>
  <text x="260" y="906" class="small center">Exact connected TB identity is still pending.</text>

  <!-- Interface zone: power -->
  <text x="515" y="327" class="label">12 V power side</text>
  <rect x="515" y="345" width="175" height="68" rx="10" class="res"/>
  <text x="602" y="373" class="label center">12 V DC PSU</text>
  <text x="602" y="397" class="small center">regulated and fused</text>
  <rect x="720" y="356" width="92" height="46" rx="7" class="res"/>
  <text x="766" y="385" class="value center">F1 3 A*</text>
  <path d="M690 379 H720" class="wire-red" marker-end="url(#arrow)"/>
  <path d="M812 379 H930" class="wire-red" marker-end="url(#arrow)"/>
  <text x="840" y="365" class="small">TB pin 5 RED +12 V</text>
  <path d="M602 413 V430 H930" class="wire-orange" marker-end="url(#arrow)"/>
  <text x="840" y="425" class="small">TB pin 9 ORANGE PSU return</text>
  <text x="515" y="440" class="tiny">This 12 V domain never enters an Uno pin.</text>
  <path d="M1015 315 V955" class="isolation"/>
  <text x="1015" y="975" class="tiny center">manual isolation boundary</text>

  <!-- METER circuit -->
  <text x="515" y="475" class="label">METER pulse input - isolated open collector</text>
  <text x="515" y="500" class="small">TB pin 7 BLUE METER+ -> Arduino D3 / INT1; pin 8 PURPLE METER- -> logic GND</text>
  <path d="M515 575 H1190" class="wire-blue"/>
  <text x="515" y="568" class="small blue">BLUE METER+</text>
  <rect x="655" y="520" width="58" height="55" rx="8" class="res"/>
  <text x="730" y="554" class="value">R1 4.7 kOhm</text>
  <path d="M684 520 V515" class="wire-black"/>
  <circle cx="684" cy="515" r="7" class="node"/>
  <text x="730" y="530" class="small">Uno 5 V pull-up</text>
  <path d="M515 625 H1190" class="wire-purple"/>
  <text x="515" y="618" class="small purple">PURPLE - METER-</text>
  <text x="800" y="662" class="small">COUNT falling edges after the measured source gap.</text>

  <!-- Inhibit circuit -->
  <text x="515" y="700" class="label">Inhibit control - NPN open-collector interface</text>
  <text x="515" y="727" class="small">TB pin 1 YELLOW INHIBIT+ and pin 2 GREEN INHIBIT-</text>
  <path d="M515 765 H625" class="wire-yellow"/>
  <text x="515" y="758" class="small yellow">YELLOW</text>
  <rect x="625" y="730" width="118" height="54" rx="8" class="res"/>
  <text x="684" y="763" class="value center">R2 1 kOhm</text>
  <path d="M743 765 V670" class="wire-black"/>
  <circle cx="743" cy="670" r="7" class="node"/>
  <text x="760" y="676" class="small">Uno 5 V logic</text>
  <path d="M515 825 H850 V785" class="wire-green" marker-end="url(#arrowGreen)"/>
  <text x="515" y="818" class="small green">GREEN - INHIBIT-</text>
  <rect x="850" y="750" width="125" height="82" rx="12" class="chip"/>
  <text x="912" y="783" class="label center">Q1 NPN</text>
  <text x="912" y="808" class="tiny center">collector sink</text>
  <path d="M912 832 V895 H1190" class="wire-black"/>
  <text x="985" y="845" class="tiny">Q1 emitter -> Arduino GND</text>
  <rect x="985" y="745" width="130" height="54" rx="8" class="res"/>
  <text x="1050" y="778" class="value center">R3 2.2 kOhm*</text>
  <path d="M985 772 H975" class="wire-black"/>
  <path d="M1190 795 H1120 V772 H1115" class="wire-black"/>
  <rect x="780" y="860" width="145" height="50" rx="8" class="res"/>
  <text x="852" y="891" class="value center">R4 100 kOhm*</text>
  <path d="M975 772 V885 H925" class="wire-black"/>
  <path d="M780 885 H730 V925 H1050 V895 H1190" class="wire-black"/>
  <text x="515" y="950" class="small">R3/R4 are interface-design values: verify base current and fail-safe default.</text>

  <!-- Uno block and logic rails -->
  <rect x="1190" y="340" width="290" height="560" rx="16" class="chip"/>
  <text x="1335" y="380" class="label center">Arduino Uno R3</text>
  <text x="1335" y="407" class="small center">USB powers logic only</text>
  <line x1="1215" y1="440" x2="1455" y2="440" stroke="#a7bfd4" stroke-width="2"/>
  <text x="1225" y="468" class="body">5 V</text><text x="1450" y="468" class="small right">logic rail</text>
  <circle cx="1190" cy="570" r="7" class="node"/><text x="1220" y="577" class="body">D3 / INT1</text><text x="1450" y="577" class="small right">METER pulse</text>
  <circle cx="1190" cy="620" r="7" class="node"/><text x="1220" y="627" class="body">GND</text><text x="1450" y="627" class="small right">METER return</text>
  <circle cx="1190" cy="795" r="7" class="node"/><text x="1220" y="802" class="body">D4</text><text x="1450" y="802" class="small right">inhibit driver</text>
  <circle cx="1190" cy="895" r="7" class="node"/><text x="1220" y="902" class="body">GND</text><text x="1450" y="902" class="small right">driver return</text>
  <text x="1335" y="930" class="small center">D0/D1 remain USB serial only.</text>

  <!-- Safety and source note -->
  <rect x="70" y="1025" width="1460" height="170" rx="14" class="warn"/>
  <text x="100" y="1060" class="warntext">BEFORE CONNECTING THE UNO</text>
  <text x="100" y="1090" class="small">1. Continuity-test all WEL-R7U02 colors and confirm the exact TB model.</text>
  <text x="100" y="1116" class="small">2. Confirm the exact PHP DIP sheet and prove reset/USB-loss state means BILL INHIBITED.</text>
  <text x="100" y="1142" class="small">3. Measure D3, D4, and every conditioned signal: 0-5 V only. Use current-limited supplies and fuses.</text>
  <text x="100" y="1168" class="small">4. Do not enable cash from this drawing alone. Record evidence in CHECKPOINT.md first.</text>
  <text x="1495" y="1168" class="tiny right">Source: TOPVME TB manual, printed page 13 (PDF page 16), WEL-R7U02 page 10.</text>
</svg>
